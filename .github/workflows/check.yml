name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: true

jobs:
  check:
    # 可选：runs-on: ubuntu-22.04 # 固定系统，避免10月自动升级Ubuntu26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5 #升级到v5适配Node24，消除警告

      - name: Setup Python
        uses: actions/setup-python@v6 #升级v6适配Node24，消除警告
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_WORKER: "shturl.cc/yT1gC4zt49f6PVqSd5efdrGxONmilKBec12GS"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Debug list public folder
        run: ls -la public || echo "!!!public目录不存在！python脚本没有生成输出!!!"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "deploy outcome: ${{ steps.deployment.outcome }}"
          echo "pages url: ${{ steps.deployment.outputs.page_url }}"
